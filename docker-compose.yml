# Prueba local de las mismas imágenes que se despliegan en Vercel
# Uso: docker compose up --build
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.vercel
    env_file: .env
    environment:
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8080:80"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.vercel
      args:
        VITE_API_URL: http://localhost:8080
    ports:
      - "5173:80"
    depends_on:
      - backend
